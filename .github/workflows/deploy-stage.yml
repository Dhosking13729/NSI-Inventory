# TEST -> STAGE promotion (Submission 3, Section 2: "a passing build is saved to S3 and deployed to the staging server").
# Run by hand from the Actions tab once a build has passed TEST. It deploys that exact build (no rebuild)
# to the Docker container on the STAGE EC2 instance, which uses its own Amazon RDS staging database.
name: Deploy to STAGE

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build ID from S3 (for example 2.0.0-1a2b3c4). Leave as 'latest' for the newest passing build on main."
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy build to STAGE (Docker on EC2 + RDS)
    runs-on: ubuntu-latest
    environment:
      name: stage
      url: ${{ vars.STAGE_URL }}
    env:
      BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_NAME: ${{ vars.STAGE_INSTANCE_NAME || 'nsi-stage' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pick the build that passed TEST
        id: build
        env:
          REQUESTED: ${{ github.event.inputs.build }}
        run: |
          if [ "$REQUESTED" = "latest" ]; then
            aws s3 cp "s3://$BUCKET/builds/latest.txt" latest.txt --only-show-errors
            BUILD=$(grep '^build=' latest.txt | cut -d= -f2)
          else
            BUILD="$REQUESTED"
          fi
          aws s3api head-object --bucket "$BUCKET" --key "builds/$BUILD/nsi-inventory.jar" > /dev/null \
            || { echo "::error::No passing build $BUILD in S3"; exit 1; }
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "### Deploying build \`$BUILD\` to STAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the deploy script
        run: aws s3 cp scripts/deploy-stage.sh "s3://$BUCKET/deploy/deploy-stage.sh" --only-show-errors

      - name: Run the deploy on the STAGE server (AWS Systems Manager, no SSH)
        env:
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running EC2 instance named $INSTANCE_NAME"; exit 1
          fi
          echo "STAGE instance: $INSTANCE_ID"
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "nsi-inventory $BUILD -> STAGE" --timeout-seconds 600 \
            --parameters "commands=[\"aws s3 cp s3://$BUCKET/deploy/deploy-stage.sh /opt/nsi/deploy-stage.sh --only-show-errors\",\"bash /opt/nsi/deploy-stage.sh $BUCKET $BUILD\"]" \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tee deploy-output.txt
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          { echo '```'; tail -25 deploy-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"
