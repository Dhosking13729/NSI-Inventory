# DEV -> TEST pipeline (Submission 3, Section 2).
#   Every push to a feature branch and every pull request into main: build + unit and integration tests
#   against a PostgreSQL test database.
#   Every merge into main: the same tests, then the passing build is saved to Amazon S3.
name: CI - DEV to TEST

on:
  push:
    branches: [main, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (PostgreSQL test database)
    runs-on: ubuntu-latest

    services:
      testdb:                              # throwaway TEST database, exists only for this job
        image: postgres:16
        env:
          POSTGRES_DB: nsi_test
          POSTGRES_USER: nsi_test
          POSTGRES_PASSWORD: nsi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nsi_test -d nsi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: nsi_test
      DB_USERNAME: nsi_test
      DB_PASSWORD: nsi_test

    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, run unit + integration tests, check coverage (70% minimum)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Build metadata
        id: meta
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$VERSION-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check the Docker image builds (used from STAGE onward)
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::7} -t nsi-inventory:${{ steps.meta.outputs.build }} .

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET, csv, os
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures')); e+=int(r.get('errors')); s+=int(r.get('skipped'))
          print(f"### Tests: {t} run, {f} failed, {e} errors, {s} skipped")
          if os.path.exists('target/site/jacoco/jacoco.csv'):
              rows=list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
              c=sum(int(x['LINE_COVERED']) for x in rows); m=sum(int(x['LINE_MISSED']) for x in rows)
              print(f"### Line coverage: {100*c/(c+m):.1f}%")
          PY

      - name: Keep test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.meta.outputs.build || github.sha }}
          path: |
            target/nsi-inventory.jar
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30

  save-to-s3:
    name: Save passing build to Amazon S3
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ needs.test.outputs.build }}
          path: build/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}     # only needed for AWS Academy lab credentials
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload JAR and reports
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          BUILD: ${{ needs.test.outputs.build }}
        run: |
          DEST="s3://$BUCKET/builds/$BUILD"
          aws s3 cp build/ "$DEST/" --recursive --only-show-errors
          printf 'build=%s\ncommit=%s\nbuilt_at=%s\nworkflow_run=%s/%s/actions/runs/%s\n' \
            "$BUILD" "$GITHUB_SHA" "$(date -u +%FT%TZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt
          aws s3 cp build-info.txt "$DEST/build-info.txt"
          aws s3 cp build-info.txt "s3://$BUCKET/builds/latest.txt"
          echo "### Saved to $DEST" >> "$GITHUB_STEP_SUMMARY"
          aws s3 ls "$DEST/" --recursive --human-readable | head -20 >> "$GITHUB_STEP_SUMMARY"
