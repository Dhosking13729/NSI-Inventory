# Shared settings. With no profile (a plain `mvnw verify` on a laptop) the app uses an in-memory H2 database.
spring:
  application:
    name: nsi-inventory
  datasource:
    url: jdbc:h2:mem:nsi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches the entities
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    environment: ${APP_ENV:local}
    git-sha: ${GIT_SHA:unknown}

nsi:
  time-zone: America/New_York
  # First Admin account is created on startup only if no staff users exist and this is set.
  bootstrap-admin-password: ${NSI_BOOTSTRAP_ADMIN_PASSWORD:}
